<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>TecOS</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("tecos-tema")||"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
<meta name="theme-color" content="#1b2133">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TecOS">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://bnzksklfspgtvexloqka.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: app de uma coluna para celular, barra superior escura, navegação inferior fixa com botão central de nova OS. */
:root{
  --bg:#f5f7f9; --surface:#ffffff; --fg:#121a2b; --muted:#5d6878; --line:#dbe1e8;
  --bar:#1b2133; --bar-fg:#e9edf3; --bar-muted:#8c96a8;
  --accent:#4fb784; --accent-ink:#0f3a26; --accent-text:#2d7f57; --accent-soft:#e3f4eb;
  --s-aberta:#e39b2f; --s-aberta-bg:#fdf3e2; --s-manut:#4a80e8; --s-manut-bg:#e8effd;
  --s-pecas:#8a5ce8; --s-pecas-bg:#f0eafd; --s-concl:#3fa66f; --s-concl-bg:#e3f4eb;
  --p-baixa:#5d6878; --p-media:#2f6fd0; --p-alta:#c46d10; --p-urg:#c4303f; --p-urg-bg:#fdecee;
  --chip-on:#121a2b; --chip-on-fg:#ffffff;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --surface:#171e2d; --fg:#e8ecf2; --muted:#98a3b5; --line:#2a3346;
  --bar:#0a0e17; --bar-fg:#e9edf3; --bar-muted:#7f8a9d;
  --accent:#4fb784; --accent-ink:#06261a; --accent-text:#6fd3a0; --accent-soft:#163327;
  --s-aberta-bg:#3a2a12; --s-manut-bg:#17284a; --s-pecas-bg:#2a1f4a; --s-concl-bg:#143224;
  --p-baixa:#98a3b5; --p-media:#7aa6f2; --p-alta:#f0a24a; --p-urg:#ff7a86; --p-urg-bg:#3e1a20;
  --chip-on:#e8ecf2; --chip-on-fg:#0f1420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#171e2d; --fg:#e8ecf2; --muted:#98a3b5; --line:#2a3346;
  --bar:#0a0e17; --bar-fg:#e9edf3; --bar-muted:#7f8a9d;
  --accent:#4fb784; --accent-ink:#06261a; --accent-text:#6fd3a0; --accent-soft:#163327;
  --s-aberta-bg:#3a2a12; --s-manut-bg:#17284a; --s-pecas-bg:#2a1f4a; --s-concl-bg:#143224;
  --p-baixa:#98a3b5; --p-media:#7aa6f2; --p-alta:#f0a24a; --p-urg:#ff7a86; --p-urg-bg:#3e1a20;
  --chip-on:#e8ecf2; --chip-on-fg:#0f1420; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-fg)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand b{color:var(--accent)}
.sync{margin-left:auto;font-size:12px;color:var(--bar-muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bar-muted)}
.dot.on{background:var(--accent)}

main{max-width:760px;margin:0 auto;padding-block:20px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin:4px 0 6px;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0 0 12px}
.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--p-urg);border-color:var(--p-urg)}
.btn.full{width:100%;justify-content:center;padding:14px;font-size:17px}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tiles .tile.wide{grid-column:span 2}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left}
.tile .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.tile .v{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.tile .v.sm{font-size:24px}
.tile .h{font-size:12px;color:var(--muted)}
button.tile:hover{border-color:var(--accent)}
.sd{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;width:100%;display:grid;gap:6px}
.card:hover{border-color:var(--accent)}
.card .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.card .eq{font-size:18px;font-weight:700;line-height:1.2}
.card .ds{color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .b{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.dates{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.atraso{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--p-urg-bg);color:var(--p-urg);border:1px solid var(--p-urg);border-radius:16px;padding:14px 16px;font:inherit}
.atraso small{color:var(--fg);opacity:.8;font-size:13px}
.atraso .go{font-weight:700;white-space:nowrap}
.timer.pausa{border-color:var(--s-pecas);color:var(--s-pecas)}
.timer.old{background:var(--p-urg-bg);border-color:var(--p-urg);color:var(--p-urg)}
.timer{margin-left:auto;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--fg)}

.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field label i{color:var(--p-urg);font-style:normal}
.field input,.field textarea,.field select{width:100%;max-width:100%;min-width:0;display:block;-webkit-appearance:none;appearance:none;min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.field textarea{min-height:92px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:18px;padding:16px;margin:0;background:var(--surface);display:grid;gap:14px;min-width:0}
legend{padding:0 6px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.elapsed{font-family:var(--f-mono);font-size:22px;font-weight:700}
.savebar{position:sticky;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:5}

.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.barrow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bartrack{height:14px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative}
.prazo{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--p-urg);opacity:.9}
.compras-p{display:block;width:100%;text-align:left;color:inherit;font:inherit;border-color:var(--s-pecas)}
.compras-p h2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.cp{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cp b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--s-pecas)}
.cp span{font-size:12px;color:var(--muted)}
.cp .vence b{color:var(--p-urg)}
.ver-cab{display:grid;gap:4px}
.ver-cab .t{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ver-desc{margin:8px 0 0;font-size:16px;line-height:1.5;max-width:65ch}
.dl{margin:0;display:grid;gap:0}
.dl-r{display:grid;grid-template-columns:minmax(0,40%) 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.dl-r:first-child,.dl-b:first-child{border-top:0;padding-top:0}
.dl dt{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dl-r dt{align-self:center}
.dl-b{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.vazio{color:var(--muted);font-style:italic}
.pausa-t{border-color:var(--s-pecas)}
.pausa-t .k{color:var(--s-pecas)}
.compra-v{border-color:var(--s-pecas)}
.compra-v h2{color:var(--s-pecas)}
.pitens{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center}
.pitem input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 10px;font-size:16px;min-height:46px;min-width:0}
.pitem .pq{text-align:center}
.pdel{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--p-urg);font-size:22px;line-height:1}
#padd{justify-self:start;margin-top:4px}
.pl{margin:0;padding-left:20px;display:grid;gap:4px}
.pl b{font-variant-numeric:tabular-nums}
fieldset.compra legend{color:var(--s-pecas)}
.compra{display:grid;gap:12px;border:1px solid var(--s-pecas);background:var(--s-pecas-bg);border-radius:14px;padding:14px}
.compra-t{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--s-pecas)}
.est-sec{display:grid;gap:4px;min-width:0}
.est-sec>*{min-width:0}
.est-sec .gitem b{flex:none}
.est-sec .h2s{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.est-sec .sub{font-size:13px;color:var(--muted)}
.hb{display:grid;gap:10px}
.hbrow{display:grid;grid-template-columns:minmax(0,34%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hbrow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.hbrow .val{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;color:var(--fg)}
.hbrow .val small{color:var(--muted);font-weight:400}
.hbrow .bartrack{height:16px}
.hbrow .barfill{background:var(--accent);border-radius:0 5px 5px 0}
.hbrow .barfill.late{background:var(--p-urg)}
.legend .pz{width:2px;height:12px;background:var(--p-urg);display:inline-block}
.barfill{height:100%;background:var(--fg);border-radius:6px}
.barrow b{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.chart{width:100%;height:auto;display:block}
.zoomable{display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:zoom-in}
.zoomable:hover{border-color:var(--accent)}
.zoomable h2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.zoomhint{color:var(--muted);flex:none}
.zoom{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.zoom-in{max-width:900px;margin:0 auto;padding-block:16px 32px;display:grid;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.zoom-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.zoom-top h2{margin:0;font-size:22px;text-wrap:balance}
.zoom .donutwrap{grid-template-columns:1fr;justify-items:center}
.zoom .donutwrap svg{max-width:340px}
.zoom .donutwrap .stack{width:100%;max-width:420px;font-size:17px}
.zoom .barrow{font-size:16px;grid-template-columns:minmax(0,45%) 1fr auto}
.zoom .barrow span:first-child{white-space:normal}
.zoom .bartrack{height:20px}
.passos{margin:0;padding-left:20px;display:grid;gap:6px}
.topico{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topico code{font-family:var(--f-mono);font-size:15px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:1;min-width:0;overflow-wrap:anywhere;user-select:all}
.hint{font-size:13px;color:var(--muted);margin:0}
.numsuf{display:flex;align-items:center;gap:8px}
.numsuf input{flex:1}
.numsuf span{color:var(--muted);font-size:14px;white-space:nowrap}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.mtab{overflow-x:auto;margin-top:12px}
.mtab table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mtab th,.mtab td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
.mtab th:first-child,.mtab td:first-child{text-align:left}
.mtab th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.donutwrap{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
.lg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.lg .lgn{min-width:0;line-height:1.25}
.lg b{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
@media (max-width:340px){.donutwrap{grid-template-columns:1fr;justify-items:center}.donutwrap svg{max-width:150px}}

.group{display:grid;gap:4px}
.group .gh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.group .gl{font-size:13px;color:var(--muted)}
.cnt{flex:none;background:var(--p-urg-bg);color:var(--p-urg);font-weight:800;border-radius:10px;padding:4px 10px;font-variant-numeric:tabular-nums}
.gitem{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.gitem span.d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:16px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.drop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop label{display:grid;place-items:center;gap:8px;text-align:center;border-radius:18px;padding:26px 10px;font-weight:600;font-size:17px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.drop label.dark{background:var(--bar);color:var(--bar-fg);border-color:var(--bar)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.link{background:none;border:0;color:var(--fg);text-decoration:underline;font-weight:500;padding:6px}
.preview{max-height:260px;border-radius:12px;border:1px solid var(--line);object-fit:contain;width:100%;background:var(--bg)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:72px}
.nav button{background:none;border:0;color:var(--bar-muted);display:grid;justify-items:center;gap:3px;font-size:12px;padding:10px 0}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .plus{align-self:center;justify-self:center;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:5px solid var(--bar);margin-top:-30px;padding:0;display:grid;place-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--p-urg-bg);border-radius:12px;padding:10px 12px;color:var(--p-urg);font-weight:600}
svg text{fill:var(--muted);font-family:var(--f-display);font-size:11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
.login{max-width:400px;margin:8vh auto 0;display:grid;gap:14px}
.sino{margin-left:auto;background:none;border:1px solid var(--bar-muted);color:var(--bar-fg);border-radius:8px;width:32px;height:28px;display:grid;place-items:center;padding:0;flex:none}
.sino[aria-current="page"]{border-color:var(--accent);color:var(--accent)}
.tema{background:none;border:1px solid var(--bar-muted);color:var(--bar-fg);border-radius:8px;width:32px;height:28px;display:grid;place-items:center;padding:0;flex:none}
.who{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--bar-muted);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.who button{background:none;border:1px solid var(--bar-muted);color:var(--bar-fg);border-radius:8px;padding:4px 10px;font-size:12px}
/* sem zoom ao tocar: toque duplo não amplia e o iPhone não aproxima ao digitar */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports (-webkit-touch-callout:none){input,select,textarea{font-size:16px!important}}

<body>

<header class="top"><div class="top-in">
  <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
  <div class="brand">Tec<b>OS</b></div>
  <button class="sino" id="sino" hidden aria-label="Alertas de OS atrasadas" title="Alertas"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button><button class="tema" id="tema" aria-label="Alternar tema claro ou escuro" title="Tema claro/escuro"></button><div class="who" id="who" hidden><span id="whoemail"></span><button id="logout">Sair</button></div>
</div></header>

<main id="app"></main>

<nav class="nav" aria-label="Navegação"><div class="nav-in">
  <button data-go="dashboard"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Painel</button>
  <button data-go="ordens"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9zM9 11h6M9 15h6"/></svg>Ordens</button>
  <button class="plus" data-go="nova" aria-label="Cadastrar OS"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="digitalizar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>Digitalizar</button>
  <button data-go="recorrentes"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>Recorrentes</button>
</div></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>

<script>
const STATUS = [
  {k:"manutencao", n:"Em manutenção", c:"var(--s-manut)", bg:"var(--s-manut-bg)"},
  {k:"pecas", n:"Aguardando peças", c:"var(--s-pecas)", bg:"var(--s-pecas-bg)"},
  {k:"concluida", n:"Concluída", c:"var(--s-concl)", bg:"var(--s-concl-bg)"},
];
const PRIO = [
  {k:"baixa", n:"Baixa", c:"var(--p-baixa)", bg:"var(--bg)"},
  {k:"media", n:"Média", c:"var(--p-media)", bg:"var(--s-manut-bg)"},
  {k:"alta", n:"Alta", c:"var(--p-alta)", bg:"var(--s-aberta-bg)"},
  {k:"urgente", n:"Urgente", c:"var(--p-urg)", bg:"var(--p-urg-bg)"},
];
const S = Object.fromEntries(STATUS.map(s=>[s.k,s])); S.aberta = S.manutencao; // "Aberta" foi unificada com "Em manutenção"
const normStatus = o => { if(o&&o.status==="aberta") o.status="manutencao"; return o; };
const P = Object.fromEntries(PRIO.map(p=>[p.k,p]));
const app = document.getElementById("app");
let verId = null, voltarDe = "ordens", bancoVelho = [];
let sb = null, session = null, canWrite = true, ready = false, loginMsg = "", okOld = false;
const ALERTA_PADRAO={ativo:true,topico:"",horas_urgente:120,horas_alta:120,horas_media:120,horas_baixa:120,repetir_horas:24,hora_inicio:7,hora_fim:22};
let alerta={...ALERTA_PADRAO}, alertaPronto=false, alertaMsg="";
let ordens = [];          // {id, ...}
let view = "dashboard", editId = null, draft = null;
let filt = {q:"", status:"todas", prio:"todas"}, periodo = 180;
let confirmDel = false, ocr = {busy:false, img:null, err:""};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
function toLocalInput(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fromLocalInput(v){ if(!v) return ""; const d=new Date(v); return isNaN(d)?"":d.toISOString(); }
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?"—":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function dur(ms){ if(!(ms>0)) return "0m"; const m=Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor(m%1440/60), mm=m%60; return (d?d+"d ":"")+(d||h?h+"h ":"")+mm+"m"; }
function limiteHoras(o){ return ({urgente:alerta.horas_urgente,alta:alerta.horas_alta,baixa:alerta.horas_baixa})[o.prioridade]||alerta.horas_media; }
function itensPeca(txt){ return String(txt||"").split(/\n|;/).map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.match(/^(\d+)\s*(?:x|×|un\.?|unid\.?|unidades?|pç|pc|pçs|pcs)?\s+(.+)$/i); return m?{q:String(+m[1]),d:m[2].trim()}:{q:"",d:l}; }); }
function txtPecas(itens){ return itens.filter(i=>String(i.d||"").trim()).map(i=>(String(i.q||"").trim()?String(i.q).trim()+"x ":"")+String(i.d).trim()).join("\n"); }
function listaPecas(txt){ const it=itensPeca(txt); return it.length?`<ul class="pl">${it.map(i=>`<li>${i.q?`<b>${esc(i.q)}×</b> `:""}${esc(i.d)}</li>`).join("")}</ul>`:""; }
function resumoPecas(txt){ const it=itensPeca(txt); if(!it.length) return ""; const p=(it[0].q?it[0].q+"× ":"")+it[0].d; return it.length>1?p+` +${it.length-1}`:p; }
function esperaPeca(o){ const base=(+o.espera_pecas_seg||0)*1000; return o.status==="pecas"&&o.pecas_desde?base+Math.max(0,Date.now()-new Date(o.pecas_desde)):base; }
function tecnico(o){ return Math.max(0,elapsed(o)-esperaPeca(o)); }
function atrasada(o){ return o.status!=="concluida"&&o.status!=="pecas"&&tecnico(o)>limiteHoras(o)*36e5; }
function elapsed(o){ const ini=new Date(o.recebimento||o.abertura); if(isNaN(ini)) return 0; const fim=o.status==="concluida"&&o.conclusao?new Date(o.conclusao):new Date(); return fim-ini; }
function pill(def){ return def?`<span class="pill" style="color:${def.c};background:${def.bg}"><span class="sd" style="background:${def.c}"></span>${esc(def.n)}</span>`:""; }
function toast(msg,ms){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(),ms||2600); }

/* ---------- banco de dados (Supabase) ---------- */
const CAMPOS=["numero","patrimonio","abertura","recebimento","setor","localizacao","solicitante","ramal","equipamento","descricao","prioridade","status","diagnostico","servico","pecas","conclusao","peca_necessaria","pedido_compra","previsao_peca","pecas_desde","espera_pecas_seg","pedido_peca_em"];
async function carregarAlerta(){
  const {data,error}=await sb.from("alertas_config").select("*").eq("id",1).maybeSingle();
  if(!error&&data){ alerta={...ALERTA_PADRAO,...data}; alertaPronto=true; } else alertaPronto=false;
}
async function carregar(){
  const {data,error}=await sb.from("ordens").select("*").order("abertura",{ascending:false});
  if(error){ toast("Não foi possível carregar as OS. Verifique a internet."); return; }
  bancoVelho = data.length ? CAMPOS.filter(k=>!(k in data[0])) : [];
  ordens=data.map(r=>{const o={id:r.id}; CAMPOS.forEach(k=>o[k]=r[k]??""); return normStatus(o);}); ready=true;
  try{ localStorage.setItem("tecos-cache-"+session.user.id, JSON.stringify(ordens)); }catch(e){}
  if(view!=="nova"&&view!=="editar"&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName||"")) render();
}
async function saveOS(o){
  const row={}; CAMPOS.forEach(k=>row[k]=(o[k]===""&&["abertura","recebimento","conclusao","patrimonio","localizacao","diagnostico","servico","pecas","solicitante","ramal","peca_necessaria","pedido_compra","previsao_peca","pecas_desde","pedido_peca_em"].includes(k))?null:o[k]);
  row.espera_pecas_seg=Math.round(+o.espera_pecas_seg||0);
  row.atualizado_em=new Date().toISOString();
  const faltando=[];
  for(let i=0;i<16;i++){
    const q=editId?sb.from("ordens").update(row).eq("id",editId):sb.from("ordens").insert(row);
    const {error}=await q; if(!error) break;
    const m=String(error.message||"").match(/'([a-z_]+)' column|column "?(?:ordens\.)?([a-z_]+)"? (?:of relation "ordens" )?does not exist/);
    const col=m&&(m[1]||m[2]);
    if((error.code==="PGRST204"||error.code==="42703")&&col&&col in row&&!["numero","status","setor","equipamento","descricao"].includes(col)){ delete row[col]; faltando.push(col); continue; }
    throw error;
  }
  await carregar();
  return faltando;
}
async function deleteOS(id){ const {error}=await sb.from("ordens").delete().eq("id",id); if(error) throw error; await carregar(); }

/* ---------- navegação ---------- */
function go(v, id){
  view=v; confirmDel=false;
  if(v==="nova"){ editId=null; draft=blank(); }
  if(v==="editar"){ editId=id; const o=ordens.find(x=>x.id===id); draft=o?{...o}:blank(); }
  if(v==="ver") verId=id;
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.go===(["editar","ver"].includes(v)?"ordens":v)?"page":"false"));
  render(); window.scrollTo(0,0);
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
function blank(){ const now=new Date().toISOString(); return {numero:"",patrimonio:"",abertura:now,recebimento:now,setor:"",localizacao:"",solicitante:"",ramal:"",peca_necessaria:"",pedido_compra:"",previsao_peca:"",pecas_desde:"",espera_pecas_seg:0,equipamento:"",descricao:"",prioridade:"media",status:"manutencao",diagnostico:"",servico:"",pecas:"",conclusao:""}; }

/* ---------- telas ---------- */
function vLogin(){
  return `<form class="login" id="login" novalidate>
  <div><div class="eyebrow">Acesso</div><h1>Entrar no TecOS</h1><p class="lead">Use o e-mail e a senha cadastrados pelo administrador.</p></div>
  <div class="field"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="username" required></div>
  <div class="field"><label for="l-senha">Senha</label><input id="l-senha" type="password" autocomplete="current-password" required></div>
  ${loginMsg?`<div class="confirm">${esc(loginMsg)}</div>`:""}
  <button class="btn pri full" type="submit">Entrar</button>
  <button class="link" type="button" id="esqueci">Esqueci minha senha</button>
  </form>`;
}
function avisoBanco(){ return bancoVelho.length?`<div class="confirm" style="display:block"><b>O banco de dados está desatualizado.</b> As peças da compra ${bancoVelho.some(c=>/solicitante|ramal/.test(c))?"e outros campos ":""}não ficam salvas até você rodar o <b>alertas.sql</b> no Supabase (SQL Editor → New query → colar → Run).<br><small>Faltam: ${bancoVelho.join(", ")}</small></div>`:""; }
function render(){
  document.querySelector(".nav").hidden=!session;
  if(!session){ app.innerHTML=vLogin(); bindLogin(); return; }
  document.getElementById("sino")?.setAttribute("aria-current",view==="alertas"?"page":"false");
  const f={dashboard:vDash, ordens:vList, nova:vForm, editar:vForm, digitalizar:vScan, recorrentes:vRec, alertas:vAlertas, estatisticas:vEst, compras:vCompras, ver:vVer}[view]||vDash;
  app.innerHTML=f(); bind();
}

function vDash(){
  const c=k=>ordens.filter(o=>o.status===k).length;
  const conc=ordens.filter(o=>o.status==="concluida"&&o.conclusao);
  const media=conc.length?conc.reduce((a,o)=>a+tecnico(o),0)/conc.length:0;
  const tile=(k,lbl,v,dot)=>`<button class="tile" data-filter="${k}"><div class="k">${dot?`<span class="sd" style="background:${dot}"></span>`:""}${lbl}</div><div class="v">${v}</div></button>`;
  return `<div class="stack">
  <div><div class="eyebrow">Painel</div><h1>Visão geral das OS</h1></div>
  ${avisoBanco()}
  <div class="row"><button class="btn" id="exp"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Exportar planilha</button>
  <button class="btn pri" data-go="nova">+ Cadastrar OS</button></div>
  ${!ready?`<div class="empty">Carregando ordens…</div>`:!ordens.length?`<div class="empty"><b>Nenhuma OS cadastrada ainda.</b><br>Toque em <b>+</b> para abrir a primeira ordem de serviço, ou em <b>Digitalizar</b> para ler uma OS em papel.</div>`:`
  ${(()=>{const n=ordens.filter(atrasada).length; return n?`<button class="atraso" data-filter="atrasadas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg><span><b>${n} OS atrasada${n>1?"s":""}</b><br><small>Passaram do prazo da prioridade sem ser finalizadas</small></span><span class="go">Ver →</span></button>`:""})()}
  <div class="tiles">
    ${tile("todas","Total de OS",ordens.length)}
    ${tile("manutencao","Em manutenção",c("manutencao"),S.manutencao.c)}
    <button class="tile" data-go="compras"><div class="k"><span class="sd" style="background:${S.pecas.c}"></span>Aguard. peças</div><div class="v">${c("pecas")}</div><div class="h" style="color:var(--accent-text);font-weight:600">Ver compras →</div></button>
    ${tile("concluida","Concluídas",c("concluida"),S.concluida.c)}
    <button class="tile wide" data-go="estatisticas"><div class="k">Tempo médio</div><div class="v sm">${durC(media)}</div><div class="h">de atendimento, sem a compra (${conc.length} OS)</div><div class="h" style="color:var(--accent-text);font-weight:600;margin-top:4px">Ver estatísticas →</div></button>
  </div>
  ${(()=>{ const ag=ordens.filter(o=>o.status==="pecas"); if(!ag.length&&!ordens.some(o=>o.pedido_peca_em)) return "";
    const hoje=new Date(); hoje.setHours(0,0,0,0); const venc=ag.filter(o=>o.previsao_peca&&new Date(o.previsao_peca+"T00:00:00")<hoje).length;
    const esp=ag.length?ag.reduce((s,o)=>s+(o.pecas_desde?Date.now()-new Date(o.pecas_desde):0),0)/ag.length:0;
    const mes=ordens.filter(o=>{const d=new Date(o.pedido_peca_em||0); return d.getMonth()===hoje.getMonth()&&d.getFullYear()===hoje.getFullYear();}).length;
    return `<button class="panel compras-p" data-go="compras"><h2>Compras de peças<span class="zoomhint">Ver →</span></h2><div class="cp">
      <div><b>${ag.length}</b><span>aguardando agora</span></div><div><b>${ag.length?durC(esp):"—"}</b><span>espera média</span></div>
      <div${venc?' class="vence"':""}><b>${venc}</b><span>previsão vencida</span></div><div><b>${mes}</b><span>pedidos este mês</span></div></div></button>`; })()}
  <button class="panel zoomable" data-zoom="equip" aria-label="Ampliar gráfico de equipamentos com mais OS"><h2>Equipamentos com mais OS<span class="zoomhint" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></span></h2>${topEquip()}</button>
  <button class="panel zoomable" data-zoom="status" aria-label="Ampliar gráfico de distribuição por status"><h2>Distribuição por status<span class="zoomhint" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></span></h2>${donut()}</button>
  <button class="panel zoomable" data-zoom="mes" aria-label="Ampliar gráfico de OS por mês"><h2>OS por mês<span class="zoomhint" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></span></h2>${lineChart()}</button>`}
  </div>`;
}
function topEquip(all){
  const m={}; ordens.forEach(o=>{const k=(o.equipamento||"Sem nome").trim(); m[k]=(m[k]||0)+1;});
  const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,all?999:8); const max=arr[0]?.[1]||1;
  return `<div class="bars">${arr.map(([n,v])=>`<div class="barrow"><span title="${esc(n)}">${esc(n)}</span><div class="bartrack"><div class="barfill" style="width:${v/max*100}%"></div></div><b>${v}</b></div>`).join("")}</div>`;
}
function donut(big){
  const tot=ordens.length; let a=-Math.PI/2; const R=60,r=40,cx=75,cy=75;
  const segs=STATUS.map(s=>{const v=ordens.filter(o=>o.status===s.k).length; if(!v) return ""; const ang=v/tot*Math.PI*2;
    if(v===tot) return `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${s.c}" stroke-width="${R-r}"/>`;
    const a2=a+ang-0.03, L=ang>Math.PI?1:0;
    const p=(rad,t)=>[cx+rad*Math.cos(t),cy+rad*Math.sin(t)];
    const [x1,y1]=p(R,a),[x2,y2]=p(R,a2),[x3,y3]=p(r,a2),[x4,y4]=p(r,a);
    const d=`M${x1} ${y1}A${R} ${R} 0 ${L} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${L} 0 ${x4} ${y4}Z`; a+=ang; return `<path d="${d}" fill="${s.c}"/>`;}).join("");
  return `<div class="donutwrap"><svg class="chart" viewBox="0 0 150 150" role="img" aria-label="Distribuição por status">${segs}<text x="75" y="72" text-anchor="middle" style="font-size:24px;font-weight:800;fill:var(--fg)">${tot}</text><text x="75" y="90" text-anchor="middle">OS</text></svg>
  <div class="stack" style="gap:8px">${STATUS.map(s=>{const v=ordens.filter(o=>o.status===s.k).length;return `<div class="lg"><span class="sd" style="background:${s.c}"></span><span class="lgn">${s.n}</span><b>${v}${big&&tot?` <span style="color:var(--muted);font-weight:500">(${Math.round(v/tot*100)}%)</span>`:""}</b></div>`}).join("")}</div></div>`;
}
function lineChart(big){
  const now=new Date(), months=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({y:d.getFullYear(),m:d.getMonth(),rec:0,con:0,ped:0});}
  const idx=iso=>{const d=new Date(iso); if(isNaN(d)) return -1; return months.findIndex(x=>x.y===d.getFullYear()&&x.m===d.getMonth());};
  ordens.forEach(o=>{const i=idx(o.recebimento||o.abertura); if(i>=0) months[i].rec++; const pd=o.pedido_peca_em||o.pecas_desde; if(pd){const p=idx(pd); if(p>=0) months[p].ped++;} if(o.status==="concluida"&&o.conclusao){const j=idx(o.conclusao); if(j>=0) months[j].con++;}});
  const mx=Math.max(3,...months.map(m=>Math.max(m.rec,m.con,m.ped))); const step=Math.ceil(mx/3); const top=step*3;
  const W=340,H=big?240:180,L=28,R=20,T=12,B=28, iw=W-L-R, ih=H-T-B;
  const X=i=>L+i*iw/11, Y=v=>T+ih-v/top*ih;
  const nm=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const line=(k,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${months.map((m,i)=>X(i)+","+Y(m[k])).join(" ")}"/>`+months.map((m,i)=>`<circle cx="${X(i)}" cy="${Y(m[k])}" r="${i===11?4:2.5}" fill="${c}"/>`).join("");
  let g=""; for(let v=0;v<=top;v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;

  const tab=big?`<div class="mtab"><table><thead><tr><th>Mês</th><th>Recebidas</th><th>Concluídas</th><th>Compra</th></tr></thead><tbody>${months.slice().reverse().map(m=>`<tr><td>${nm[m.m]}/${m.y}</td><td>${m.rec}</td><td>${m.con}</td><td>${m.ped}</td></tr>`).join("")}</tbody></table></div>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="OS recebidas, concluídas e enviadas para compra por mês">${g}${ped}${line("rec","var(--fg)")}${line("con","var(--accent)")}${lbl}</svg>
  <div class="legend" style="margin-top:8px"><span><span class="sd" style="background:var(--fg)"></span>Recebidas</span><span><span class="sd" style="background:var(--accent)"></span>Concluídas</span><span><span class="sd" style="background:var(--s-pecas);border-radius:3px"></span>Enviadas para compra</span></div>${tab}`;
}

/* ---------- estatísticas de fechamento ---------- */
let estPer=180;
function durC(ms){ if(!(ms>0)) return "—"; const m=Math.round(ms/6e4), d=Math.floor(m/1440), h=Math.floor(m%1440/60), mm=m%60; return d?`${d}d ${h}h`:h?`${h}h ${mm}m`:`${mm}m`; }
function mediana(a){ if(!a.length) return 0; const b=a.slice().sort((x,y)=>x-y), k=b.length>>1; return b.length%2?b[k]:(b[k-1]+b[k])/2; }
function hbars(rows,{max,prazo,cor}={}){
  const mx=max||Math.max(1,...rows.map(r=>Math.max(r.v,r.pz||0)));
  return `<div class="hb">${rows.map(r=>`<div class="hbrow" title="${esc(r.n)}: ${esc(r.tip||"")}"><span class="n">${esc(r.n)}</span><div class="bartrack"><div class="barfill${r.late?" late":""}" style="width:${Math.max(2,r.v/mx*100)}%${cor&&!r.late?";background:"+cor:""}"></div>${r.pz?`<span class="prazo" style="left:calc(${Math.min(100,r.pz/mx*100)}% - 1px)"></span>`:""}</div><span class="val">${r.lbl}</span></div>`).join("")}</div>`;
}
function barrasMes(itens,{pz=0,cor="var(--accent)",rot="Média"}={}){
  const nm=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"], now=new Date(), meses=[];
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); meses.push({y:d.getFullYear(),m:d.getMonth(),s:0,n:0}); }
  itens.forEach(({d,v})=>{ const x=meses.find(q=>q.y===d.getFullYear()&&q.m===d.getMonth()); if(x){ x.s+=v; x.n++; } });
  const W=340,H=190,L=34,R=8,T=16,B=26, iw=W-L-R, ih=H-T-B;
  const mxv=Math.max(pz,...meses.map(q=>q.n?q.s/q.n:0),864e5), dias=Math.ceil(mxv/864e5), step=Math.max(1,Math.ceil(dias/4)), top=step*Math.ceil(dias/step)*864e5;
  const Y=v=>T+ih-v/top*ih, bw=iw/12;
  let g=""; for(let v=0;v<=top;v+=step*864e5) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v/864e5}d</text>`;
  const bars=meses.map((q,i)=>{ if(!q.n) return ""; const a=q.s/q.n, x=L+i*bw+bw*.18, w=bw*.64, y=Y(a);
    return `<g><title>${nm[q.m]}/${q.y}: média ${durC(a)} em ${q.n} OS</title><path d="M${x} ${T+ih}V${y+3}a3 3 0 0 1 3-3h${w-6}a3 3 0 0 1 3 3V${T+ih}Z" fill="${pz&&a>pz?"var(--p-urg)":cor}"/></g>`; }).join("");
  const lbl=meses.map((q,i)=>i%2===1||i===11?`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${nm[q.m]}/${String(q.y).slice(2)}</text>`:"").join("");
  const pzl=pz?`<line x1="${L}" x2="${W-R}" y1="${Y(pz)}" y2="${Y(pz)}" stroke="var(--p-urg)" stroke-width="1.5"/><text x="${L+4}" y="${Y(pz)-5}" style="fill:var(--p-urg)">prazo ${durC(pz)}</text>`:"";
  const tab=`<div class="mtab"><table><thead><tr><th>Mês</th><th>OS</th><th>${rot}</th></tr></thead><tbody>${meses.slice().reverse().filter(q=>q.n).map(q=>`<tr><td>${nm[q.m]}/${q.y}</td><td>${q.n}</td><td>${durC(q.s/q.n)}</td></tr>`).join("")}</tbody></table></div>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${bars}${pzl}${lbl}</svg>${tab}`;
}
function estCompras(lim){
  const ped=o=>new Date(o.pedido_peca_em||o.pecas_desde||o.recebimento||0);
  const feitas=ordens.filter(o=>o.status!=="pecas"&&(+o.espera_pecas_seg||0)>0&&ped(o).getTime()>=lim);
  const andam=ordens.filter(o=>o.status==="pecas");
  const sec=(t,sub,body)=>`<div class="panel est-sec"><div class="h2s"><h2 style="margin:0">${t}</h2>${sub?`<span class="sub">${sub}</span>`:""}</div>${body}</div>`;
  const cab=`<div style="margin-top:12px"><div class="eyebrow" style="color:var(--s-pecas)">Compra de peças</div><h2 style="font-size:24px;margin:2px 0 4px">Tempo de compra</h2><p class="lead" style="margin:0">Do envio para compra até a peça chegar (botão <b>Peça chegou</b>), nos pedidos feitos no período.</p></div>`;
  if(!feitas.length&&!andam.length) return cab+`<div class="empty">Nenhuma compra de peça no período.</div>`;
  const t=feitas.map(esperaPeca), med=t.length?t.reduce((a,b)=>a+b,0)/t.length:0;
  const espA=andam.length?andam.reduce((a,o)=>a+esperaPeca(o),0)/andam.length:0;
  const comPrev=feitas.filter(o=>o.previsao_peca), cumpr=comPrev.filter(o=>ped(o).getTime()+esperaPeca(o)<=new Date(o.previsao_peca+"T23:59:59").getTime()).length;
  const tile=(k,v,h)=>`<div class="tile" style="border-color:color-mix(in srgb,var(--s-pecas) 45%,var(--line))"><div class="k">${k}</div><div class="v sm">${v}</div>${h?`<div class="h">${h}</div>`:""}</div>`;
  const porPeca=(()=>{ const m={}; feitas.forEach(o=>{ const it=itensPeca(o.peca_necessaria); (it.length?it.map(i=>i.d):["Não informada"]).forEach(d=>{ const g=d.charAt(0).toUpperCase()+d.slice(1); (m[g]=m[g]||[]).push(esperaPeca(o)); }); });
    return Object.entries(m).map(([n,a])=>{ const v=a.reduce((x,y)=>x+y,0)/a.length; return {n,v,c:a.length,lbl:`${durC(v)} <small>· ${a.length}</small>`,tip:`média ${durC(v)} em ${a.length} compras`}; }).sort((a,b)=>b.c-a.c||b.v-a.v).slice(0,8).sort((a,b)=>b.v-a.v); })();
  return cab+`<div class="tiles">
    ${tile("Tempo médio de compra",feitas.length?durC(med):"—",`${feitas.length} compra${feitas.length===1?"":"s"} concluída${feitas.length===1?"":"s"}`)}
    ${tile("Mediana",feitas.length?durC(mediana(t)):"—","metade chega em até")}
    ${tile("Mais demorada",feitas.length?durC(Math.max(...t)):"—","")}
    ${tile("Em compra agora",String(andam.length),andam.length?`esperando há ${durC(espA)} em média`:"")}
    ${comPrev.length?tile("Previsão cumprida",Math.round(cumpr/comPrev.length*100)+"%",`${cumpr} de ${comPrev.length} com previsão`):""}
  </div>
  ${feitas.length?sec("Tempo médio de compra por mês","pelo mês do pedido",barrasMes(feitas.map(o=>({d:ped(o),v:esperaPeca(o)})),{cor:"var(--s-pecas)",rot:"Compra"})):""}
  ${porPeca.length?sec("Por peça","média · nº de compras",hbars(porPeca,{cor:"var(--s-pecas)"})):""}`;
}
function vEst(){
  const agora=Date.now(), lim=estPer?agora-estPer*864e5:0;
  const todas=ordens.filter(o=>o.status==="concluida"&&o.conclusao&&!isNaN(new Date(o.conclusao))&&tecnico(o)>0);
  const conc=todas.filter(o=>new Date(o.conclusao).getTime()>=lim);
  const t=conc.map(tecnico), soma=t.reduce((a,b)=>a+b,0), media=t.length?soma/t.length:0;
  const noPrazo=conc.filter(o=>tecnico(o)<=limiteHoras(o)*36e5).length;
  const abertas=ordens.filter(o=>o.status!=="concluida"), idade=abertas.length?abertas.reduce((a,o)=>a+tecnico(o),0)/abertas.length:0;
  const per=[[30,"30 dias"],[90,"90 dias"],[180,"6 meses"],[365,"1 ano"],[0,"Tudo"]];
  const head=`<div><div class="eyebrow">Estatísticas</div><h1>Tempo de fechamento das OS</h1><p class="lead"><b>Atendimento</b>: do recebimento à conclusão, com o relógio parado enquanto a OS espera peça. A <b>compra de peças</b> tem estatística própria, mais abaixo.</p></div>
  <div class="chips">${per.map(([d,n])=>`<button class="chip" data-eper="${d}" aria-pressed="${estPer===d}">${n}</button>`).join("")}</div>`;
  if(!conc.length) return `<div class="stack">${head}<div class="empty"><b>Nenhuma OS concluída neste período.</b><br>Ao concluir uma OS, informe a <b>data de conclusão</b>; ela entra aqui automaticamente.${todas.length?"<br>Escolha um período maior para ver as OS mais antigas.":""}</div>
  ${abertas.length?`<div class="tiles"><div class="tile"><div class="k">Em aberto agora</div><div class="v">${abertas.length}</div><div class="h">idade média ${durC(idade)}</div></div></div>`:""}${estCompras(lim)}</div>`;
  const pct=Math.round(noPrazo/conc.length*100);
  const tile=(k,v,h,extra="")=>`<div class="tile"${extra}><div class="k">${k}</div><div class="v sm">${v}</div>${h?`<div class="h">${h}</div>`:""}</div>`;
  // por mês (12 meses, sempre)
  const nm=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"], now=new Date(), meses=[];
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); meses.push({y:d.getFullYear(),m:d.getMonth(),s:0,n:0}); }
  todas.forEach(o=>{ const d=new Date(o.conclusao), x=meses.find(q=>q.y===d.getFullYear()&&q.m===d.getMonth()); if(x){ x.s+=tecnico(o); x.n++; } });
  const pzs=[alerta.horas_urgente,alerta.horas_alta,alerta.horas_media,alerta.horas_baixa], pzUnico=pzs.every(v=>v===pzs[0])?pzs[0]*36e5:0;
  const W=340,H=190,L=34,R=8,T=16,B=26, iw=W-L-R, ih=H-T-B;
  const mxv=Math.max(pzUnico,...meses.map(q=>q.n?q.s/q.n:0),864e5); const dias=Math.ceil(mxv/864e5); const step=Math.max(1,Math.ceil(dias/4)), top=step*Math.ceil(dias/step)*864e5;
  const Y=v=>T+ih-v/top*ih, bw=iw/12;
  let g=""; for(let v=0;v<=top;v+=step*864e5) g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v/864e5}d</text>`;
  const bars=meses.map((q,i)=>{ if(!q.n) return ""; const a=q.s/q.n, x=L+i*bw+bw*.18, w=bw*.64, y=Y(a), h=Math.max(2,T+ih-y);
    return `<g><title>${nm[q.m]}/${q.y}: média ${durC(a)} em ${q.n} OS</title><path d="M${x} ${T+ih}V${y+3}a3 3 0 0 1 3-3h${w-6}a3 3 0 0 1 3 3V${T+ih}Z" fill="${pzUnico&&a>pzUnico?"var(--p-urg)":"var(--accent)"}"/></g>`; }).join("");
  const lbl=meses.map((q,i)=>i%2===1||i===11?`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${nm[q.m]}/${String(q.y).slice(2)}</text>`:"").join("");
  const pzLine=pzUnico?`<line x1="${L}" x2="${W-R}" y1="${Y(pzUnico)}" y2="${Y(pzUnico)}" stroke="var(--p-urg)" stroke-width="1.5"/><text x="${L+4}" y="${Y(pzUnico)-5}" text-anchor="start" style="fill:var(--p-urg)">prazo ${durC(pzUnico)}</text>`:"";
  const mesTab=`<div class="mtab"><table><thead><tr><th>Mês</th><th>OS</th><th>Média</th></tr></thead><tbody>${meses.slice().reverse().filter(q=>q.n).map(q=>`<tr><td>${nm[q.m]}/${q.y}</td><td>${q.n}</td><td>${durC(q.s/q.n)}</td></tr>`).join("")}</tbody></table></div>`;
  // por prioridade
  const porPrio=PRIO.slice().reverse().map(p=>{ const a=conc.filter(o=>o.prioridade===p.k); if(!a.length) return null; const v=a.reduce((s,o)=>s+tecnico(o),0)/a.length, pz=limiteHoras({prioridade:p.k})*36e5;
    return {n:p.n,v,pz,late:v>pz,lbl:`${durC(v)} <small>· ${a.length}</small>`,tip:`média ${durC(v)} em ${a.length} OS; prazo ${durC(pz)}`}; }).filter(Boolean);
  // faixas
  const fx=[["Até 1 dia",0,1],["1 a 3 dias",1,3],["3 a 5 dias",3,5],["5 a 10 dias",5,10],["Mais de 10 dias",10,1e9]].map(([n,a,b])=>{ const c=conc.filter(o=>{const d=tecnico(o)/864e5; return d>=a&&d<b;}).length; return {n,v:c,lbl:`${c} <small>· ${Math.round(c/conc.length*100)}%</small>`,tip:`${c} OS`}; });
  // por grupo
  const grupo=k=>{ const m={}; conc.forEach(o=>{ const g=(o[k]||"Não informado").trim(); (m[g]=m[g]||[]).push(tecnico(o)); });
    return Object.entries(m).map(([n,a])=>{ const v=a.reduce((x,y)=>x+y,0)/a.length; return {n,v,c:a.length,lbl:`${durC(v)} <small>· ${a.length}</small>`,tip:`média ${durC(v)} em ${a.length} OS`}; }).sort((a,b)=>b.c-a.c||b.v-a.v).slice(0,8).sort((a,b)=>b.v-a.v); };
  const lentas=conc.slice().sort((a,b)=>tecnico(b)-tecnico(a)).slice(0,5);
  const sec=(t,sub,body)=>`<div class="panel est-sec"><div class="h2s"><h2 style="margin:0">${t}</h2>${sub?`<span class="sub">${sub}</span>`:""}</div>${body}</div>`;
  return `<div class="stack">${head}
  <div class="tiles">
    ${tile("Atendimento médio",durC(media),`${conc.length} OS concluídas`)}
    ${tile("Mediana",durC(mediana(t)),"metade fecha em até")}
    ${tile("No prazo",pct+"%",`${noPrazo} de ${conc.length} OS`,pct<70?' style="border-color:var(--p-urg)"':"")}
    ${tile("Mais rápida",durC(Math.min(...t)),"")}
    ${tile("Mais demorada",durC(Math.max(...t)),"")}
    ${tile("Em aberto agora",String(abertas.length),abertas.length?`idade média ${durC(idade)}`:"")}
    ${(()=>{ const ce=conc.filter(o=>esperaPeca(o)>0); return ce.length?tile("Tempo total médio",durC(conc.reduce((a,o)=>a+elapsed(o),0)/conc.length),"atendimento + compra"):""; })()}
  </div>
  ${sec("Tempo médio por mês","últimos 12 meses, pelo mês de conclusão",`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tempo médio de fechamento por mês">${g}${bars}${pzLine}${lbl}</svg>
    <div class="legend"><span><span class="sd" style="background:var(--accent)"></span>Dentro do prazo</span>${pzUnico?`<span><span class="sd" style="background:var(--p-urg)"></span>Acima do prazo</span>`:""}</div>${mesTab}`)}
  ${sec("Por prioridade","média · nº de OS",hbars(porPrio)+`<div class="legend" style="margin-top:6px"><span><span class="pz"></span>Prazo da prioridade</span></div>`)}
  ${sec("Quanto tempo leva para fechar","nº de OS · % do total",hbars(fx))}
  ${sec("Por setor","média · nº de OS",hbars(grupo("setor")))}
  ${sec("Por equipamento","média · nº de OS",hbars(grupo("equipamento")))}
  ${sec("Mais demoradas","",lentas.map(x=>`<button class="gitem" data-open="${esc(x.id)}"><span class="num">${esc(x.numero||"s/ nº")}</span><span class="d">${esc(x.equipamento||"")} · ${esc(x.setor||"")}</span><b style="white-space:nowrap;font-variant-numeric:tabular-nums">${durC(tecnico(x))}</b></button>`).join(""))}
  ${estCompras(lim)}
  </div>`;
}

/* ---------- compras (aguardando peça) ---------- */
function transicaoPeca(orig,o){
  const agora=new Date(), era=orig?.status==="pecas", vai=o.status==="pecas";
  if(vai&&!era){ o.pecas_desde=agora.toISOString(); if(!o.pedido_peca_em) o.pedido_peca_em=o.pecas_desde; }
  if(vai&&era) o.pecas_desde=orig.pecas_desde||agora.toISOString();
  if(era&&!vai){ const ini=new Date(orig.pecas_desde); o.espera_pecas_seg=(+orig.espera_pecas_seg||0)+(isNaN(ini)?0:Math.max(0,(agora-ini)/1000)); o.pecas_desde=""; }
}
function vCompras(){
  const lista=ordens.filter(o=>o.status==="pecas").sort((a,b)=>new Date(a.pecas_desde||a.recebimento||0)-new Date(b.pecas_desde||b.recebimento||0));
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const fmtD=d=>{ const [y,m,dd]=String(d).split("-"); return dd&&m?`${dd}/${m}/${y}`:d; };
  const item=o=>{ const desde=o.pecas_desde?Date.now()-new Date(o.pecas_desde):0; const prev=o.previsao_peca?new Date(o.previsao_peca+"T00:00:00"):null; const venc=prev&&prev<hoje;
    return `<div class="panel group"><div class="gh"><div style="min-width:0"><span class="num">${esc(o.numero)}</span><h2 style="margin:2px 0 4px;font-size:16px">${esc(o.equipamento||"")}</h2>${o.peca_necessaria?listaPecas(o.peca_necessaria):'<div class="vazio">Peças não informadas</div>'}
      <div class="gl">${esc(o.setor||"")}${o.ramal?" · Ramal "+esc(o.ramal):""}</div>
      <div class="gl">${o.pedido_compra?"Pedido "+esc(o.pedido_compra)+" · ":""}${prev?`<span style="${venc?"color:var(--p-urg);font-weight:700":""}">Previsão ${fmtD(o.previsao_peca)}${venc?" (vencida)":""}</span>`:"Sem previsão"}</div></div>
      <span class="cnt" style="background:var(--s-pecas-bg);color:var(--s-pecas)">${desde?durC(desde):"—"}</span></div>
      <div class="row"><button class="btn pri" data-chegou="${esc(o.id)}">Peça chegou</button><button class="btn" data-open="${esc(o.id)}">Abrir OS</button></div></div>`; };
  return `<div class="stack">
  <div><div class="eyebrow">Compras</div><h1>Aguardando peça</h1><p class="lead">OS que dependem de compra. O número à direita é o tempo de espera. Quando a peça chegar, toque em <b>Peça chegou</b>: a OS volta para Em manutenção.</p></div>
  ${!ready?`<div class="empty">Carregando…</div>`:lista.length?lista.map(item).join(""):`<div class="empty"><b>Nenhuma OS aguardando peça.</b><br>Ao avaliar uma OS, marque o status <b>Aguardando peças</b> e informe a peça: ela aparece aqui.</div>`}
  </div>`;
}

function bindAlertas(){
  const c=document.getElementById("copiar"); if(!c) return;
  c.onclick=async()=>{ const t=alerta.topico; try{ await navigator.clipboard.writeText(t); toast("Nome do canal copiado"); }catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById("topico")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Texto selecionado: copie pelo menu"); } };
  document.getElementById("teste").onclick=async e=>{ e.target.disabled=true; const {error}=await sb.rpc("tecos_alerta_teste"); e.target.disabled=false;
    toast(error?"Não foi possível enviar o teste.":"Teste enviado. Confira o celular."); };
  document.getElementById("salvarAlerta").onclick=async()=>{
    const v={}; let ruim="";
    app.querySelectorAll("[data-a]").forEach(i=>{ const n=parseInt(i.value,10); if(isNaN(n)||n<+i.min||n>+i.max) ruim=i.closest(".field").querySelector("label").textContent; v[i.dataset.a]=n; });
    app.querySelectorAll("[data-d]").forEach(i=>{ const n=parseFloat(String(i.value).replace(",",".")); if(isNaN(n)||n<0.5||n>83) ruim=i.closest(".field").querySelector("label").textContent; v[i.dataset.d]=Math.round(n*24); });
    if(ruim){ alertaMsg="Valor inválido em: "+ruim+"."; render(); return; }
    if(v.hora_fim<=v.hora_inicio){ alertaMsg="O horário final precisa ser depois do inicial."; render(); return; }
    v.ativo=document.getElementById("a-ativo").checked;
    const {error}=await sb.from("alertas_config").update(v).eq("id",1);
    if(error){ alertaMsg="Não foi possível salvar. Verifique a internet."; render(); return; }
    alerta={...alerta,...v}; alertaMsg=""; toast("Alertas salvos"); render();
  };
}

  const c={equip:()=>topEquip(true),status:()=>donut(true),mes:()=>lineChart(true)}[k]();
  el.innerHTML=`<div class="zoom-in"><div class="zoom-top"><h2>${t}</h2><button class="btn" id="zoomx">Fechar</button></div><div class="panel">${c}</div></div>`;

function fecharZoom(){ zoomAtual=null; document.getElementById("zoom")?.remove(); document.body.style.overflow=""; }

/* ---------- eventos ---------- */
function bind(){
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ if(view!=="ver"&&view!=="editar") voltarDe=view; go("ver",b.dataset.open); });
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>go("editar",b.dataset.edit));
  app.querySelectorAll("[data-voltar]").forEach(b=>b.onclick=()=>go(voltarDe||"ordens"));
  app.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filt={q:"",status:b.dataset.filter,prio:"todas"}; go("ordens");});
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filt[b.dataset.f]=b.dataset.v; render();});
  app.querySelectorAll("[data-zoom]").forEach(b=>b.onclick=()=>abrirZoom(b.dataset.zoom));
  app.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{periodo=+b.dataset.per; render();});
  app.querySelectorAll("[data-chegou]").forEach(b=>b.onclick=async()=>{ const orig=ordens.find(x=>x.id===b.dataset.chegou); if(!orig) return; b.disabled=true;
    const o={...orig,status:"manutencao"}; transicaoPeca(orig,o); const prevEdit=editId; editId=orig.id;
    try{ await saveOS(o); toast("OS "+orig.numero+" voltou para Em manutenção"); }catch(x){ toast("Não foi possível atualizar. Verifique a internet."); b.disabled=false; } finally{ editId=prevEdit; } });
  app.querySelectorAll("[data-eper]").forEach(b=>b.onclick=()=>{estPer=+b.dataset.eper; render();});
  const q=document.getElementById("q"); if(q){ q.oninput=()=>{filt.q=q.value; const pos=q.selectionStart; render(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos);}; }
  const exp=document.getElementById("exp"); if(exp) exp.onclick=exportCSV;
  const form=document.getElementById("form");
  if(form){
    const sugereRamal=()=>{ const r=document.getElementById("f-ramal"); const sv=document.getElementById("f-setor")?.value||"", lv=document.getElementById("f-localizacao")?.value||"";
      if(!r||r.value.trim()||!sv.trim()) return;
      const st=sv.trim().toLowerCase(), lc=lv.trim().toLowerCase();
      const ant=ordens.filter(x=>x.ramal&&String(x.setor||"").trim().toLowerCase()===st).sort((a,b)=>(lc&&String(b.localizacao||"").trim().toLowerCase()===lc)-(lc&&String(a.localizacao||"").trim().toLowerCase()===lc)||new Date(b.abertura||0)-new Date(a.abertura||0))[0];
      if(ant){ r.value=ant.ramal; draft.ramal=ant.ramal; } };
    ["f-setor","f-localizacao"].forEach(id=>document.getElementById(id)?.addEventListener("change",sugereRamal));
    form.querySelectorAll("input,textarea").forEach(el=>{ el.oninput=el.onchange=()=>{draft[el.name]=el.type==="datetime-local"?fromLocalInput(el.value):el.value; const e=document.getElementById("el"); if(e) e.textContent=dur(tecnico(draft)); okOld=false;}; });
    form.querySelectorAll("[data-pq],[data-pd]").forEach(el=>el.oninput=()=>{ const k=+(el.dataset.pq??el.dataset.pd); draft._itens[k][el.dataset.pq!=null?"q":"d"]=el.value; draft.peca_necessaria=txtPecas(draft._itens); });
    form.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{ draft._itens.splice(+b.dataset.pdel,1); draft.peca_necessaria=txtPecas(draft._itens); render(); });
    const padd=document.getElementById("padd"); if(padd) padd.onclick=()=>{ draft._itens.push({q:"1",d:""}); render(); const l=app.querySelectorAll(".pd"); l[l.length-1]?.focus(); };
    form.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{draft[b.dataset.set]=b.dataset.v;
      if(b.dataset.set==="status"&&b.dataset.v==="concluida"&&!draft.conclusao) draft.conclusao=new Date().toISOString();
      render();});
    form.onsubmit=async e=>{e.preventDefault();
      const miss=[["numero","Número da OS"],["abertura","Data de abertura"],["recebimento","Recebimento"],["setor","Setor"],["equipamento","Equipamento"],["descricao","Descrição do problema"]].filter(([k])=>!String(draft[k]||"").trim()).map(x=>x[1]);
      const err=document.getElementById("ferr");
      if(miss.length){ err.hidden=false; err.textContent="Preencha: "+miss.join(", ")+"."; err.scrollIntoView({block:"center"}); return; }
      const t=k=>draft[k]?new Date(draft[k]).getTime():null, agora=Date.now();
      const ab=t("abertura"), rc=t("recebimento"), cc=t("conclusao");
      const futuro=[["abertura","Data de abertura"],["recebimento","Recebimento"],["conclusao","Data de conclusão"]].filter(([k])=>t(k)&&t(k)>agora+36e5).map(x=>x[1]);
      if(futuro.length){ err.hidden=false; err.textContent="Data no futuro: "+futuro.join(", ")+". Confira dia, mês e ano."; err.scrollIntoView({block:"center"}); return; }
      if(ab&&rc&&rc<ab-6e4){ err.hidden=false; err.textContent="O recebimento ("+fmtDate(draft.recebimento)+") está antes da abertura ("+fmtDate(draft.abertura)+"). Confira as datas."; err.scrollIntoView({block:"center"}); return; }
      if(cc&&rc&&cc<rc){ err.hidden=false; err.textContent="A conclusão ("+fmtDate(draft.conclusao)+") está antes do recebimento ("+fmtDate(draft.recebimento)+"). Confira as datas."; err.scrollIntoView({block:"center"}); return; }
      if(rc&&agora-rc>60*864e5&&draft.status!=="concluida"&&!okOld){ okOld=true; err.hidden=false; err.textContent="O recebimento está em "+fmtDate(draft.recebimento)+", há "+Math.floor((agora-rc)/864e5)+" dias. Se estiver certo, toque em salvar de novo."; err.scrollIntoView({block:"center"}); return; }
      if(draft._itens) draft.peca_necessaria=txtPecas(draft._itens);
      if(draft.status==="pecas"&&!String(draft.peca_necessaria||"").trim()){ err.hidden=false; err.textContent="Informe pelo menos uma peça para enviar a OS para compras."; app.querySelector(".pd")?.focus(); return; }
      const dup=ordens.find(x=>x.numero.trim()===draft.numero.trim()&&x.id!==editId);
      if(dup){ err.hidden=false; err.textContent="Já existe uma OS com o número "+draft.numero+"."; return; }
      const {_ocr, _texto, _itens, ...clean}=draft; const now=new Date().toISOString();
      const o={...clean}; transicaoPeca(editId?ordens.find(x=>x.id===editId):null,o);
      try{ const era=editId; const falt=await saveOS(o); if(falt.length) toast("OS salva. Para guardar também "+(falt.some(c=>/peca|pedido|espera/.test(c))?"a compra de peças":"os campos novos")+", rode o alertas.sql no Supabase.",7000); else toast(era?"OS atualizada":"OS cadastrada"); if(era) go("ver",era); else go("ordens"); }
      catch(x){ err.hidden=false; err.textContent=x?.code==="23505"?"Já existe uma OS com o número "+draft.numero+".":(x?.code==="PGRST204"||/solicitante|ramal|peca_|pedido_|espera_|pecas_desde/.test(x?.message||""))?"Faltam campos novos no banco: rode de novo o alertas.sql no Supabase (SQL Editor).":"Não foi possível salvar. Verifique a internet e tente de novo."; }
    };
    const del=document.getElementById("del"); if(del) del.onclick=()=>{confirmDel=true; render();};
    const dn=document.getElementById("delno"); if(dn) dn.onclick=()=>{confirmDel=false; render();};
    const dy=document.getElementById("delyes"); if(dy) dy.onclick=async()=>{try{await deleteOS(editId); toast("OS excluída"); go(voltarDe&&voltarDe!=="ver"?voltarDe:"ordens");}catch(x){toast("Não foi possível excluir.");}};
  }
  bindAlertas();
  ["cam","pick"].forEach(id=>{const i=document.getElementById(id); if(i) i.onchange=()=>i.files[0]&&readPhoto(i.files[0]);});
}

/* ---------- leitura de foto ---------- */
async function shrink(file){
  const img=await new Promise((res,rej)=>{const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file);});
  const sc=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement("canvas");
  c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r({blob:b,url:c.toDataURL("image/jpeg",.7)}),"image/jpeg",.85));
}
let tessLoad=null;
function loadTess(){ return tessLoad||(tessLoad=new Promise((res,rej)=>{const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; sc.onload=()=>res(window.Tesseract); sc.onerror=rej; document.head.append(sc);})); }
function extrair(txt){
  const d=blank(); const lines=txt.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const pick=(re)=>{ for(const l of lines){ const m=l.match(re); if(m&&m[1]&&m[1].trim()) return m[1].trim(); } return ""; };
  d.numero=pick(/(?:\bO\.?\s?S\.?|ordem(?: de servi[cç]o)?)\s*(?:n[º°o.]*|:|-)?\s*[:#]?\s*([A-Z0-9][\w\-\/]{1,20})/i);
  d.patrimonio=pick(/patrim[oô]nio\s*(?:n[º°o.]*)?\s*[:\-]?\s*([\w\-\/]{2,20})/i);
  d.setor=pick(/setor\s*[:\-]\s*(.+)/i);
  d.solicitante=pick(/(?:solicitante|requisitante|solicitado por)\s*[:\-]\s*(.+)/i);
  d.ramal=pick(/ramal\s*[:\-]?\s*(\d{3,6})/i);
  d.localizacao=pick(/(?:local(?:iza[cç][aã]o)?|sala|leito)\s*[:\-]\s*(.+)/i);
  d.equipamento=pick(/equipamento\s*[:\-]\s*(.+)/i);
  d.descricao=pick(/(?:defeito|problema|descri[cç][aã]o|ocorr[eê]ncia)[^:]*[:\-]\s*(.+)/i);
  const dt=txt.match(/(\d{2})\/(\d{2})\/(\d{2,4})(?:\s+(\d{1,2})[:h](\d{2}))?/);
  if(dt){ const y=dt[3].length===2?"20"+dt[3]:dt[3]; const x=new Date(+y,+dt[2]-1,+dt[1],+(dt[4]||8),+(dt[5]||0)); if(!isNaN(x)) d.abertura=x.toISOString(); }
  if(/urgente/i.test(txt)) d.prioridade="urgente";
  if(!d.descricao) d.descricao="";
  d.diagnostico=""; d._ocr=true; d._texto=txt.trim();
  return d;
}
async function readPhoto(file){
  ocr={busy:true,img:null,err:"",prog:"Preparando a leitura…"}; render();
  try{
    const {blob,url}=await shrink(file); ocr.img=url; render();
    const T=await loadTess();
    const r=await T.recognize(blob,"por",{logger:m=>{ if(m.status==="recognizing text"){ ocr.prog="Lendo a OS… "+Math.round(m.progress*100)+"%"; const e=app.querySelector(".empty"); if(e) e.textContent=ocr.prog; } }});
    const d=extrair(r.data.text||"");
    ocr={busy:false,img:null,err:""}; view="nova"; editId=null; draft=d; go2form();
  }catch(x){
    ocr.busy=false; ocr.err="Não consegui ler a foto. Verifique a internet, tente outra foto com mais luz ou cadastre manualmente."; render();
  }
}
function go2form(){ document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current","false")); render(); window.scrollTo(0,0); }

/* ---------- exportar ---------- */
async function exportCSV(){
  const cols=[["numero","Nº OS"],["patrimonio","Patrimônio"],["abertura","Abertura"],["recebimento","Recebimento"],["setor","Setor"],["localizacao","Localização"],["solicitante","Solicitante"],["ramal","Ramal"],["equipamento","Equipamento"],["descricao","Descrição do problema"],["prioridade","Prioridade"],["status","Status"],["diagnostico","Diagnóstico"],["servico","Serviço realizado"],["pecas","Peças"],["conclusao","Conclusão"],["_tempo","Tempo de atendimento"],["_compra","Tempo de compra"],["_total","Tempo total"]];
  const val=(o,k)=>k==="_tempo"?dur(tecnico(o)):k==="_compra"?(esperaPeca(o)?dur(esperaPeca(o)):""):k==="_total"?dur(elapsed(o)):k==="status"?S[o.status]?.n:k==="prioridade"?P[o.prioridade]?.n:["abertura","recebimento","conclusao"].includes(k)?(o[k]?fmtDate(o[k]):""):o[k];
  const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const csv="﻿"+[cols.map(c=>cell(c[1])).join(";"),...ordens.map(o=>cols.map(c=>cell(val(o,c[0]))).join(";"))].join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`TecOS_${new Date().toISOString().slice(0,10)}.csv`; document.body.append(a); a.click(); a.remove();
}

/* ---------- login ---------- */
function bindLogin(){
  const f=document.getElementById("login");
  f.onsubmit=async e=>{ e.preventDefault(); const email=document.getElementById("l-email").value.trim(), senha=document.getElementById("l-senha").value;
    if(!email||!senha){ loginMsg="Informe e-mail e senha."; render(); return; }
    const b=f.querySelector("[type=submit]"); b.disabled=true; b.textContent="Entrando…";
    const {error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error){ loginMsg="E-mail ou senha incorretos."; render(); document.getElementById("l-email").value=email; } };
  document.getElementById("esqueci").onclick=async()=>{ const email=document.getElementById("l-email").value.trim();
    if(!email){ loginMsg="Digite seu e-mail acima e toque de novo em Esqueci minha senha."; render(); return; }
    await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    loginMsg="Se o e-mail estiver cadastrado, você vai receber um link para criar nova senha."; render(); document.getElementById("l-email").value=email; };
}
const SOL='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const LUA='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function pintaTema(){ const d=document.documentElement.dataset.theme==="dark"; document.getElementById("tema").innerHTML=d?SOL:LUA; }
document.getElementById("tema").onclick=()=>{ const n=document.documentElement.dataset.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=n; try{localStorage.setItem("tecos-tema",n);}catch(e){} pintaTema(); render(); };
pintaTema();
document.getElementById("sino").onclick=()=>go("alertas");
document.getElementById("logout").onclick=()=>sb.auth.signOut();

/* ---------- início ---------- */
(async()=>{
  const cfg=window.TECOS_CONFIG||{};
  if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes("COLE_AQUI")){ app.innerHTML=`<div class="empty" style="margin-top:10vh"><b>Falta configurar o banco de dados.</b><br>Preencha o arquivo config.js com o endereço e a chave do Supabase.</div>`; document.querySelector(".nav").hidden=true; return; }
  // abre na hora com a última cópia das OS enquanto confere a conta e busca o que mudou
  let provisoria=false;
  try{
    const ref=new URL(cfg.SUPABASE_URL).hostname.split(".")[0];
    const tok=JSON.parse(localStorage.getItem(`sb-${ref}-auth-token`)||"null");
    const c=tok?.user?.id && JSON.parse(localStorage.getItem("tecos-cache-"+tok.user.id)||"null");
    if(Array.isArray(c)){ session={user:tok.user}; ordens=c; ready=true; provisoria=true;
      document.getElementById("who").hidden=false; document.getElementById("whoemail").textContent=tok.user.email||""; go("dashboard"); }
  }catch(e){}
  sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
  sb.auth.onAuthStateChange(async (ev,sess)=>{
    if(provisoria){ const mesma = sess && session?.user?.id===sess.user?.id; provisoria=false;
      if(mesma){ session=sess; document.getElementById("sino").hidden=false; carregarAlerta().then(()=>{ if(view!=="nova"&&view!=="editar") render(); }); carregar(); return; }
      session=null; }
    if(ev==="PASSWORD_RECOVERY"){ const nova=window.prompt("Digite sua nova senha (mínimo 6 caracteres):"); if(nova){ const {error}=await sb.auth.updateUser({password:nova}); toast(error?"Não foi possível trocar a senha.":"Senha alterada."); } }
    const had=!!session; session=sess; loginMsg="";
    const who=document.getElementById("who"); who.hidden=!session; document.getElementById("sino").hidden=!session; document.getElementById("whoemail").textContent=session?.user?.email||"";
    if(session&&!had){ carregarAlerta().then(()=>{ if(view!=="nova"&&view!=="editar") render(); }); ready=false; try{ const c=JSON.parse(localStorage.getItem("tecos-cache-"+session.user.id)||"null"); if(Array.isArray(c)){ ordens=c.map(normStatus); ready=true; } }catch(e){} go("dashboard"); carregar(); }
    if(!session){ ordens=[]; ready=false; try{ Object.keys(localStorage).filter(k=>k.startsWith("tecos-cache-")).forEach(k=>localStorage.removeItem(k)); }catch(e){} render(); }
  });
  const {data}=await sb.auth.getSession(); if(!data.session) render();
  window.addEventListener("focus",()=>session&&carregar());
})();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
setInterval(()=>{ if(session) carregar(); },60000);
